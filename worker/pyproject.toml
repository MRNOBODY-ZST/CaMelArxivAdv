[project]
name = "camel-arxiv-worker"
version = "0.1.0"
description = "Isolated arXiv metadata and TeX extraction worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.14.0,<1",
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "ray[client]>=2.55,<3",
    "redis>=6.4.0,<7",
    "structlog>=25.4.0,<26",
]

[project.scripts]
arxiv-worker = "app.main:cli"
personalization-worker = "app.personalization.main:cli"

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2",
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.2.0,<2",
    "ruff>=0.14.0,<1",
    "types-defusedxml>=0.7.0.20250822,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
